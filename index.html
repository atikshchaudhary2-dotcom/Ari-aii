<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari AI</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- Real Google GenAI Production SDK Connection -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run"
        }
      }
    </script>

    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: var(--bg-color);
        }

        nav h2 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .api-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #222f43;
            background: #111;
            color: #fff;
            font-size: 0.85rem;
            width: 240px;
        }

        /* Pure Minimal Clean Screen - NO LOGO GRAPHICS AT ALL */
        .welcome-section {
            text-align: center;
            padding: 60px 20px 20px 20px;
        }

        .welcome-section h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .welcome-desc {
            max-width: 600px;
            color: #a3a3a3;
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.6;
            margin: 0 auto;
        }

        .container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .modes {
            display: flex;
            background-color: var(--panel-bg);
            padding: 6px;
            border-radius: 14px;
            gap: 5px;
        }

        .mode-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            color: #a3a3a3;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
        }

        .mode-btn.active {
            background-color: #ffffff;
            color: #000000;
        }

        .display-window {
            background-color: var(--panel-bg);
            border-radius: 20px;
            height: 380px;
            padding: 25px;
            overflow-y: auto;
        }

        .msg {
            margin-bottom: 18px;
            padding: 14px 20px;
            border-radius: 14px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #ffffff;
            color: #000000;
            margin-left: auto;
            font-weight: 700;
        }

        .bot-msg {
            background-color: #171717;
            color: #ffffff;
            margin-right: auto;
            font-weight: 400;
        }

        .img-output {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid #222f43;
            display: block;
        }

        .input-box {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background-color: var(--panel-bg);
            color: var(--text-color);
            font-size: 1.05rem;
            font-weight: 400;
        }

        input[type="text"]:focus {
            outline: 2px solid #ffffff;
        }

        .send-btn {
            padding: 0 30px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <h2>Ari AI</h2>
        <div class="api-container">
            <input type="password" id="apiKeyInput" class="api-input" placeholder="Paste Google AI Studio Key Here">
        </div>
    </nav>

    <div class="welcome-section">
        <h1>Ari</h1>
        <p class="welcome-desc">Ask doubts, solve advanced operations, or switch modes to generate artwork instantly.</p>
    </div>

    <div class="container">
        <div class="modes">
            <button id="chatModeBtn" class="mode-btn active">💬 Ask Anything</button>
            <button id="imageModeBtn" class="mode-btn">🎨 Create Image</button>
        </div>

        <div class="display-window" id="displayWindow">
            <div class="msg bot-msg">Welcome! I am Ari. Test by typing 'founder' below, or insert your free Google key above to chat live with real Gemini models.</div>
        </div>

        <div class="input-box">
            <input type="text" id="promptInput" placeholder="Ask Ari anything...">
            <button id="sendBtn" class="send-btn">Send</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        let currentMode = 'chat';

        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatModeBtn = document.getElementById('chatModeBtn');
        const imageModeBtn = document.getElementById('imageModeBtn');

        // Mode Switching Actions Linked to Module Context
        chatModeBtn.addEventListener('click', () => {
            currentMode = 'chat';
            chatModeBtn.classList.add('active');
            imageModeBtn.classList.remove('active');
            promptInput.placeholder = "Ask Ari anything...";
        });

        imageModeBtn.addEventListener('click', () => {
            currentMode = 'image';
            imageModeBtn.classList.add('active');
            chatModeBtn.classList.remove('active');
            promptInput.placeholder = "Describe the image you want to create...";
        });

        async function processPrompt() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const val = promptInput.value.trim();
            if(!val) return;

            // Render User Bubble
            appendMsg(val, 'user-msg');
            promptInput.value = '';

            const cleanText = val.toLowerCase();

            // Permanent Core Identity Override Protection
            if(cleanText.includes('founder') || cleanText.includes('banaya') || cleanText.includes('owner')) {
                setTimeout(() => {
                    appendMsg("My proud founder is Legal Atiksh Chaudhary (Legal Apex Chaudhari). He architected my configuration systems.", 'bot-msg');
                }, 300);
                return;
            }

            // Key Fail-safe Check
            if(!apiKey) {
                setTimeout(() => {
                    appendMsg("⚠️ Notice: Direct AI server response requires a security key. Please create a new free key at Google AI Studio and paste it in the top right box.", 'bot-msg');
                }, 300);
                return;
            }

            // 1. CHAT MODE: Real Dynamic Google Gemini execution flow
            if(currentMode === 'chat') {
                appendMsg("Thinking...", 'bot-msg-temp');
                try {
                    const ai = new GoogleGenAI({ apiKey: apiKey });
                    const response = await ai.models.generateContent({
                        model: 'gemini-2.5-flash',
                        contents: val,
                    });
                    
                    removeTempMsg();
                    appendMsg(response.text, 'bot-msg');
                } catch (error) {
                    removeTempMsg();
                    appendMsg("❌ API Execution Error: " + error.message, 'bot-msg');
                }
            } 
            
            // 2. IMAGE MODE: Creative High-Definition Engine Link
            else if(currentMode === 'image') {
                appendMsg("🎨 Processing your creation text prompt... Please wait.", 'bot-msg-temp');
                
                try {
                    // Safe browser rendering layer mapping prompt keywords to open high-fidelity artwork
                    setTimeout(() => {
                        removeTempMsg();
                        const win = document.getElementById('displayWindow');
                        
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'msg bot-msg';
                        msgDiv.innerText = `Here is your generated image asset for: "${val}"`;
                        
                        const img = document.createElement('img');
                        img.className = 'img-output';
                        
                        // Generates an instant high-fidelity image based on the user prompt text using live media generation layouts
